# Ricostruisce e ripubblica il sito ogni volta che cambia il codice.
#
# Senza questo, dopo ogni modifica bisognerebbe rifare il build a mano e
# ricaricare i file. Cosi invece basta un push: il sito sull'iPhone si aggiorna
# da solo alla successiva apertura (il service worker chiede sempre alla rete
# per index.html, proprio per questo motivo).
#
# Il sito finisce nel ramo gh-pages. Perche' compaia online, una volta sola,
# serve impostare in Settings > Pages:
#   Source: "Deploy from a branch"  ->  ramo "gh-pages", cartella "/ (root)"

name: Pubblica il sito

on:
  push:
    branches:
      - main
      - claude/rubik-hero-kids-app-b6v1q4
  workflow_dispatch:

# Basta il permesso di scrivere nel repository: pubblichiamo su un ramo.
permissions:
  contents: write

# Se arrivano due push ravvicinati, si pubblica solo l'ultimo.
concurrency:
  group: pagine
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlli (test e tipi)
        run: |
          npm run typecheck
          npm test

      - name: Costruisci il sito
        # Il percorso deve combaciare con il nome del repository: il sito vive
        # su https://<utente>.github.io/<repo>/
        run: node scripts/build-pages.mjs "/${GITHUB_REPOSITORY#*/}"

      - name: Pubblica sul ramo gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito costruito da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
